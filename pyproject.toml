[project]
name = "mypackage"
version = "0.1.0"
description = "A Python package for geospatial / SAR machine learning."
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Core runtime dependencies: keep this minimal. Add packages with `uv add <name>`.
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
# Install with `uv sync --extra geo` / `--extra ml`, or `uv add --optional geo <pkg>`
geo = [
    "rasterio>=1.4",
    "rioxarray>=0.15",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
]
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
]

[project.urls]
Repository = "https://git.example.org/your-group/mypackage"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "mypy>=1.10",
    "ruff>=0.6",
    "tox-uv>=1.11",
    "ipykernel>=6.29",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "pymdown-extensions>=10,<12", # 12.x breaks mkdocstrings 1.0 (Highlight API)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mypackage"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules"

[tool.coverage.run]
branch = true
source = ["mypackage"]

[tool.coverage.report]
skip_empty = true

[tool.mypy]
files = ["src"]
python_version = "3.10"
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
# Many geo/SAR libraries ship without type stubs
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true
extend-exclude = ["notebooks/**"]

[tool.ruff.lint]
select = [
    "YTT", # flake8-2020
    "S",   # flake8-bandit
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "T10", # flake8-debugger
    "SIM", # flake8-simplify
    "I",   # isort
    "C90", # mccabe
    "E", "W", # pycodestyle
    "F",   # pyflakes
    "PGH", # pygrep-hooks
    "UP",  # pyupgrade
    "RUF", # ruff
    "TRY", # tryceratops
    "NPY", # numpy-specific rules
]
ignore = [
    "E501",   # line length is handled by the formatter
    "E731",   # lambda assignment
    "TRY003", # long exception messages
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"examples/*" = ["T201"]

[tool.ruff.format]
preview = true
