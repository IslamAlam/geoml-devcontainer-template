site_name: mypackage
site_description: A Python package for geospatial / SAR machine learning.
repo_url: https://git.example.org/your-group/mypackage
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Development: dev.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
