site_name: geoml-devcontainer-template
site_description: Python package template with a GPU dev container for geospatial, SAR and ML work.
site_url: https://geoml-template.imansour.net/
repo_url: https://github.com/IslamAlam/geoml-devcontainer-template
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Glossary: glossary.md
  - Development: dev.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - toc:
      permalink: true
